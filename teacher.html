<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Buster • Teacher Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="hero"><div><div class="eyebrow">BUG BUSTER • TEACHER AREA</div><h1>📊 Marks Dashboard</h1><p>View results and download the marks CSV.</p></div><div class="bug">👩‍🏫</div></header><section id="login" class="card"><h2>🔐 Teacher Login</h2><p>This area is separate from the student quiz.</p><label>Teacher Access Code</label><input id="password" type="password" placeholder="Enter access code"><button id="loginBtn" class="primary">Open Dashboard</button><p id="loginMsg" class="msg"></p></section><section id="dash" class="hidden"><div class="stats"><div class="stat card"><span>Students</span><strong id="students">0</strong></div><div class="stat card"><span>Attempts</span><strong id="attempts">0</strong></div><div class="stat card"><span>Average</span><strong id="average">0%</strong></div></div><section class="card"><div class="toolbar"><input id="search" placeholder="🔎 Search register number"><button id="refresh" class="secondary">↻ Refresh</button><button id="download" class="primary">⬇ Download CSV</button></div><div class="tableWrap"><table><thead><tr><th>Register Number</th><th>Score</th><th>Max</th><th>%</th><th>Attempt</th><th>Completed</th></tr></thead><tbody id="body"></tbody></table></div><p id="status" class="msg"></p></section><a href="index.html" class="button secondary">← Student Quiz</a></section><footer>Bug Buster Teacher Dashboard</footer></main><script src="config.js"></script><script src="teacher.js"></script></body></html>
